[project]
name = "labs"
version = "0.1.0"
description = "Лабораторные работы: каркас проекта с конфигурацией, логированием и CLI."
readme = "README.md"
authors = [
    { name = "Kirill_Markov", email = "enifl33fi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
rg = "labs.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["E501"]  # длина строки — зона форматтера

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- mypy (strict) ----------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
disallow_untyped_decorators = false  # typer-декораторы не всегда типизированы
show_error_codes = true

# ---------------- pytest / coverage ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=labs --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src/labs"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
